<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Checklist</title>
<meta name="theme-color" content="#3f6b4e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#dfe6d8;--paper:#f8f3e4;--ink:#1f2d24;--mute:#76806f;--line:#e3dcc6;--forest:#3f6b4e;--moss:#6f8f55;--ns:#c3c7b4;--ip:#d2a95b;--ok:#4f8a62;--nf:#c4795a;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Montserrat","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:32px 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
.frame{max-width:1180px;margin:0 auto;background:var(--paper);box-shadow:0 30px 60px rgba(40,70,50,.22);position:relative}
nav{display:flex;align-items:center;justify-content:space-between;padding:26px 40px}
.logo{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.5px}
.links{display:flex;gap:44px}
.links button{background:none;border:0;padding:4px 0;border-bottom:1px solid transparent;font-size:14px}
.links button.on{border-color:var(--ink)}
.me{width:38px;height:38px;border-radius:50%;border:0;color:#fff;font-family:var(--serif);font-size:22px;font-weight:600;display:grid;place-items:center}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px 0 40px}
.rail{display:flex;flex-direction:column;gap:28px;padding-top:30px}
.who{display:flex;align-items:stretch;background:none;border:0;padding:0;text-align:left;opacity:.75;transition:opacity .2s}
.who.on{opacity:1}
.who .tab{width:78px;display:grid;place-items:center;color:#fff;font-size:22px;background:var(--ns)}
.who.on .tab{background:var(--moss)}
.who .tag{flex:1;padding:16px 14px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.08);border-right:3px solid transparent}
.who.on .tag{border-color:var(--moss)}
.who b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.who small{color:var(--mute);font-size:12px}
.main{padding:0 40px 0 20px;min-width:0}
.eyebrow{font-family:var(--serif);font-size:30px;margin:10px 0 0;line-height:1}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,8vw,86px);line-height:.95;margin:0;letter-spacing:-1.5px}
.tagline{color:var(--mute);margin:16px 0 0;font-size:14px;letter-spacing:.5px}
.stats{display:flex;flex-wrap:wrap;gap:32px 48px;align-items:flex-end;margin:28px 0 8px}
.big{font-family:var(--serif);font-size:56px;line-height:1}
.big small{display:block;font-family:var(--sans);font-size:12px;color:var(--mute);margin-top:6px}
.field{flex:1;min-width:240px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--ink)}
.field input{flex:1;border:0;background:none;font-family:var(--serif);font-size:24px;padding:4px 0;min-width:0;color:var(--ink)}
.field input:focus{outline:none}
.field label{font-size:13px;padding-bottom:8px}
.plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:none;font-size:20px;line-height:1;margin-bottom:4px}
.plus:hover{background:var(--ink);color:#fff}
.list{margin-top:28px}
.item{padding:20px 0;border-top:1px solid var(--line)}
.item.sub{margin:14px 0 0 22px;padding:14px 0 0 18px;border-top:0;border-left:2px solid var(--line)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1;word-break:break-word}
.sub .name{font-size:22px}
.s-ok>.head .name{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1}
.x:hover{color:var(--moss)}
.prog{font-size:12px;color:var(--mute);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.pill{border:1px solid var(--ns);background:none;border-radius:99px;padding:5px 13px;font-size:12px;color:var(--mute)}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill.on{background:var(--c);border-color:var(--c);color:#fff}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;font-size:12px;padding:5px 13px;border:1px solid var(--ink);background:none}
.chip:hover{background:var(--ink);color:#fff}
.chip.mine{background:var(--c);border-color:var(--c);color:#fff}
.av{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-family:var(--serif);font-size:16px;font-weight:600}
.note{width:100%;margin-top:12px;min-height:84px;border:0;border-bottom:1px solid var(--ink);background:#fff;padding:12px;font:inherit;resize:vertical;color:var(--ink)}
.addsub{display:flex;gap:8px;margin:14px 0 0 22px;padding-left:18px;border-left:2px solid var(--line);align-items:flex-end}
.addsub input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;padding:6px 0;color:var(--ink)}
.addsub input:focus{outline:none;border-color:var(--ink)}
.addsub button{background:none;border:0;font-size:13px;border-bottom:1px solid var(--ink);padding:2px 0}
.namewrap{display:flex;align-items:center;gap:10px;min-width:0}
.subplus{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:none;font-size:18px;line-height:1;padding:0;display:grid;place-items:center}
.subplus:hover,.subplus.on{background:var(--ink);color:#fff}
.plan{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.plan input{border:1px solid var(--ns);border-radius:99px;background:none;padding:3px 10px;font:inherit;font-size:12px;color:var(--ink)}
.sfil{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}
.sfil span{font-size:12px;color:var(--mute);margin-right:4px}
.empty{padding:50px 0;text-align:center;font-family:var(--serif);font-size:28px;color:var(--mute);border-top:1px solid var(--line)}
.bar{position:sticky;bottom:0;display:flex;height:86px;z-index:5}
.bl{width:260px;background:var(--forest);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 32px;gap:8px;font-size:13px}
.track{height:4px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;background:#fff;transition:width .4s}
.br{flex:1;background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:20px;padding:0 40px;font-size:13px}
.avs{display:flex}.avs .av{border:2px solid var(--moss);margin-left:-8px;width:34px;height:34px;background:#fff;color:var(--moss)}
.br .cta{background:#fff;color:var(--moss);border:0;border-radius:99px;padding:11px 34px;font-weight:600;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(25,40,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.box{background:var(--paper);padding:40px;max-width:460px;width:100%;text-align:center}
.box h2{font-family:var(--serif);font-size:42px;font-weight:500;margin:0 0 6px;line-height:1}
.pick{display:flex;gap:14px;margin-top:26px}
.pick button{flex:1;border:0;color:#fff;padding:22px 8px;font-family:var(--serif);font-size:30px;font-weight:600}
@media(max-width:820px){
 body{padding:0}.frame{box-shadow:none}
 nav{padding:18px 20px;flex-wrap:wrap;gap:12px}.links{order:3;width:100%;gap:22px;overflow-x:auto}
 .layout{grid-template-columns:1fr;gap:0;padding-top:0}
 .rail{flex-direction:row;gap:12px;padding:0 20px;overflow-x:auto}.who{flex:1;min-width:150px}.who .tab{width:46px}
 .main{padding:24px 20px 0}.bl{width:36%;padding:0 16px}.br{padding:0 16px;gap:12px}.br .txt{display:none}.br .cta{padding:11px 22px}.avs{display:none}.br{justify-content:center}
}
</style>
</head>
<body>
<div class="frame">
 <nav>
  <div class="logo">Document Checklist</div>
  <div class="links" id="links"></div>
  <button class="me" id="meBtn" data-act="toggle" title="Switch user"></button>
 </nav>
 <div class="layout">
  <aside class="rail" id="rail"></aside>
  <main class="main">
   <p class="eyebrow">Shared checklist</p>
   <h1>Documents to gather</h1>
   <p class="tagline">Add, claim and track everything in one place.</p>
   <div class="stats">
    <div class="big" id="big"></div>
    <div class="field"><label for="newDoc">New document</label><input id="newDoc" placeholder="e.g. Passport copy" maxlength="120" autocomplete="off"><button class="plus" data-act="addDoc" aria-label="Add document">+</button></div>
   </div>
   <div class="sfil" id="sfil" hidden></div>
   <div class="list" id="list"></div>
  </main>
 </div>
 <div class="bar">
  <div class="bl"><span id="count"></span><div class="track"><i id="fill"></i></div></div>
  <div class="br"><div class="avs" id="avs"></div><div class="txt" id="claimTxt"></div><button class="cta" data-act="focus">Add document</button></div>
 </div>
</div>
<div id="modal"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDFGkLIsC0TrlygnMV06Sn8pJ2TFkjizP4",
  authDomain:"documentgather.firebaseapp.com",
  projectId:"documentgather",
  storageBucket:"documentgather.firebasestorage.app",
  messagingSenderId:"580753515742",
  appId:"1:580753515742:web:23c1f02769d462cd1bce4f"
});
const ref=doc(getFirestore(app),"shared","checklist");

/* ---------- Storage layer (Firestore, live-synced) ---------- */
const Store={
 load(){return {items:[]}},
 save(s){setDoc(ref,s).catch(e=>console.error('Save failed',e))},
 subscribe(cb){onSnapshot(ref,snap=>{if(snap.exists())cb(snap.data())},e=>console.error('Sync failed',e))}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const USERS=['Yoni','Tom'],COL={Yoni:'var(--forest)',Tom:'var(--moss)'};
const ST=['Not started','In progress','Complete','Needs final fixes'];
const SC={'Not started':'var(--ns)','In progress':'var(--ip)','Complete':'var(--ok)','Needs final fixes':'var(--nf)'};
const FIL=[['all','All'],['mine','Mine'],['free','Unclaimed'],['todo','Not complete']];
let S=Store.load(),me=localStorage.getItem('docs_me'),filter='all',sfilter='any',open=new Set(),addOpen=new Set();
const uid=()=>Math.random().toString(36).slice(2,9);
const find=id=>S.items.find(i=>i.id===id);
function commit(){Store.save(S);render()}
const ORDER={'In progress':0,'Needs final fixes':1,'Not started':2,'Complete':3};
const byStatus=(a,b)=>(ORDER[a.status]??9)-(ORDER[b.status]??9);
const match=i=>filter==='mine'?i.claim===me&&(sfilter==='any'||i.status===sfilter):filter==='free'?!i.claim:filter==='todo'?i.status!=='Complete':true;

function item(i,isSub){
 const kids=S.items.filter(c=>c.parent===i.id).sort(byStatus);
 let h=`<div class="item${isSub?' sub':''} s-${i.status==='Complete'?'ok':'x'}" data-id="${i.id}"><div class="head"><div class="namewrap"><div class="name">${esc(i.title)}</div>${isSub?'':`<button class="subplus${addOpen.has(i.id)?' on':''}" data-act="subtoggle" aria-label="Add sub-document" title="Add sub-document">${addOpen.has(i.id)?'−':'+'}</button>`}</div><button class="x" data-act="del" aria-label="Delete">×</button></div>`;
 if(kids.length)h+=`<div class="prog">${kids.filter(k=>k.status==='Complete').length} of ${kids.length} sub-documents complete</div>`;
 h+=`<div class="row">${ST.map(s=>`<button class="pill${s===i.status?' on':''}" style="--c:${SC[s]}" data-act="status" data-s="${s}">${s}</button>`).join('')}</div><div class="row">`;
 if(!i.claim)h+=`<button class="chip" data-act="claim">Claim</button>`;
 else if(i.claim===me)h+=`<button class="chip mine" style="--c:${COL[me]}" data-act="release"><span class="av" style="--c:rgba(255,255,255,.3)">${me[0]}</span>Yours · release</button>`;
 else h+=`<span class="av" style="--c:${COL[i.claim]}">${i.claim[0]}</span><span>${i.claim}’s</span><button class="chip" data-act="claim">Take over</button>`;
 h+=`<span class="sp"></span><label class="plan">Planned<input type="date" data-act="planned" value="${esc(i.planned||'')}"></label><button class="chip" data-act="note">Notes${i.notes?' •':''}</button></div>`;
 if(open.has(i.id))h+=`<textarea class="note" data-act="notes" placeholder="Where to get it, deadlines, tips…">${esc(i.notes||'')}</textarea>`;
 if(!isSub){
  kids.filter(match).forEach(k=>h+=item(k,true));
  if(addOpen.has(i.id))h+=`<div class="addsub"><input data-sub="${i.id}" placeholder="Add a sub-document" maxlength="120" autocomplete="off"><button data-act="addSub">Add</button></div>`;
 }
 return h+'</div>';
}
function render(){
 const n=S.items.length,d=S.items.filter(i=>i.status==='Complete').length,pc=n?Math.round(d/n*100):0;
 $('#links').innerHTML=FIL.map(([k,l])=>`<button class="${filter===k?'on':''}" data-act="filter" data-k="${k}">${l}</button>`).join('');
 const m=$('#meBtn');m.textContent=me?me[0]:'?';m.style.background=me?COL[me]:'var(--ns)';
 $('#rail').innerHTML=USERS.map(u=>`<button class="who${u===me?' on':''}" data-act="me" data-u="${u}"><span class="tab">${u===me?'♥':''}</span><span class="tag"><b>${u}</b><small>${S.items.filter(i=>i.claim===u).length} claimed</small></span></button>`).join('');
 $('#big').innerHTML=`${pc}%<small>${d} of ${n} complete</small>`;
 $('#count').textContent=n?`${d} of ${n} complete`:'Nothing added yet';
 $('#fill').style.width=pc+'%';
 $('#avs').innerHTML=USERS.map(u=>`<span class="av">${u[0]}</span>`).join('');
 $('#claimTxt').innerHTML=USERS.map(u=>`${u} ${S.items.filter(i=>i.claim===u).length}`).join(' / ')+'<br>claimed';
 const sf=$('#sfil');sf.hidden=filter!=='mine';
 sf.innerHTML=filter==='mine'?'<span>Status</span>'+[['any','Any'],...ST.map(x=>[x,x])].map(([k,l])=>`<button class="pill${sfilter===k?' on':''}" style="--c:${SC[k]||'var(--ink)'}" data-act="sfilter" data-k="${k}">${l}</button>`).join(''):'';
 const tops=S.items.filter(i=>!i.parent&&(match(i)||S.items.some(c=>c.parent===i.id&&match(c)))).sort(byStatus);
 $('#list').innerHTML=tops.length?tops.map(i=>item(i,false)).join(''):`<div class="empty">${n?'Nothing matches this filter.':'Add your first document above.'}</div>`;
 $('#modal').innerHTML=me?'':`<div class="modal"><div class="box"><h2>Who’s here?</h2><div>Pick your name for this device.</div><div class="pick">${USERS.map(u=>`<button style="background:${COL[u]}" data-act="me" data-u="${u}">${u}</button>`).join('')}</div></div></div>`;
}
function add(t,p){t=t.trim();if(!t)return;S.items.push({id:uid(),title:t,parent:p||null,status:'Not started',claim:null,notes:'',planned:''});commit()}
const focusSub=id=>{const el=document.querySelector(`[data-sub="${id}"]`);if(el)el.focus()};
function setMe(u){me=u;localStorage.setItem('docs_me',u);render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,c=b.closest('[data-id]'),it=c&&find(c.dataset.id);
 if(a==='me')setMe(b.dataset.u);
 else if(a==='toggle')setMe(me==='Yoni'?'Tom':'Yoni');
 else if(a==='filter'){filter=b.dataset.k;render()}
 else if(a==='sfilter'){sfilter=sfilter===b.dataset.k?'any':b.dataset.k;render()}
 else if(a==='addDoc'){const i=$('#newDoc');add(i.value,null);i.value='';i.focus()}
 else if(a==='focus'){$('#newDoc').scrollIntoView({behavior:'smooth',block:'center'});$('#newDoc').focus()}
 else if(a==='addSub'){const id=b.previousElementSibling.dataset.sub;add(b.previousElementSibling.value,id);focusSub(id)}
 else if(!it)return;
 else if(a==='subtoggle'){addOpen.has(it.id)?addOpen.delete(it.id):addOpen.add(it.id);render();if(addOpen.has(it.id))focusSub(it.id)}
 else if(a==='status'){it.status=b.dataset.s;commit()}
 else if(a==='claim'){it.claim=me;commit()}
 else if(a==='release'){it.claim=null;commit()}
 else if(a==='note'){open.has(it.id)?open.delete(it.id):open.add(it.id);render()}
 else if(a==='del'){
  const k=S.items.filter(x=>x.parent===it.id).length;
  if(confirm(`Delete “${it.title}”${k?` and its ${k} sub-document${k>1?'s':''}`:''}?`)){S.items=S.items.filter(x=>x.id!==it.id&&x.parent!==it.id);commit()}
 }
});
document.addEventListener('change',e=>{
 const t=e.target,c=t.closest('[data-id]'),it=c&&find(c.dataset.id);
 if(it&&t.dataset.act==='notes'){it.notes=t.value;commit()}
 if(it&&t.dataset.act==='planned'){it.planned=t.value;commit()}
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
 if(e.target.id==='newDoc'){add(e.target.value,null);e.target.value='';$('#newDoc').focus()}
 else if(e.target.dataset.sub){const id=e.target.dataset.sub;add(e.target.value,id);focusSub(id)}
});
let pending=false;
const typing=()=>/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'');
Store.subscribe(s=>{S={items:s.items||[]};if(typing())pending=true;else render()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!typing()){pending=false;render()}},0));
render();
</script>
</body>
</html>
